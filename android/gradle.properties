# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED
org.gradle.parallel=true
android.useAndroidX=true
android.enableJetifier=true
# Pub cache (C:) and project (D:) are on different drives; Kotlin incremental
# compilation chokes on cross-drive relative paths, so disable it.
kotlin.incremental=false

# Use the JDK bundled with Android Studio for Gradle/Kotlin builds.
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr

# Parallel project evaluation races Flutter's plugin loader (file_picker reads
# the "flutter" extension before the app module registers it).
org.gradle.parallel=false
