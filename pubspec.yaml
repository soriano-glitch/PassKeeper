name: passkeeper
description: A secure, offline-first password manager.
publish_to: 'none'
version: 1.1.2+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  flutter_secure_storage: ^11.2.0
  local_auth: ^2.3.0
  cryptography: ^2.7.0
  cryptography_flutter: ^2.3.0
  uuid: ^4.4.0
  file_picker: ^13.1.0
  path_provider: ^2.1.4
  share_plus: ^13.3.1
  shared_preferences: ^2.3.0
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

# App icon generation (run: flutter pub run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "img/passkeeper_icon_1024.png"
  adaptive_icon_background: "#10302E"
  adaptive_icon_foreground: "img/passkeeper_adaptive_foreground.png"
  adaptive_icon_monochrome: "img/passkeeper_adaptive_monochrome.png"

flutter:
  uses-material-design: true
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-400.ttf
          weight: 400
        - asset: assets/fonts/DMSans-500.ttf
          weight: 500
        - asset: assets/fonts/DMSans-600.ttf
          weight: 600
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-600.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-700.ttf
          weight: 700
