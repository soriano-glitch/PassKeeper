# Builds PassKeeper native app artifacts in the cloud and (on version tags)
# publishes them as a GitHub Release.
#
# - Android: signed release APK (uses the debug keystore, same as local builds).
# - iOS: unsigned release .ipa, suitable for
#     * Apple Developer Program members: re-sign with Xcode (xcodebuild or
#       developer tools) and distribute via TestFlight / App Store / direct install
#     * Local testing on devices: install via Xcode, AltStore, or Sideloadly
#
# Trigger manually from the Actions tab, on push to main/master, or on a v* tag.
#
# NOTE: macOS runners are free on public repositories; private repositories
# consume Actions minutes at a 10x multiplier.

name: Build Mobile Apps

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: PassKeeper-android
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS App (unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -qr PassKeeper-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PassKeeper-ios
          path: PassKeeper-unsigned.ipa

  release:
    name: Publish GitHub Release
    needs: [android, ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release assets
        run: |
          mkdir -p release
          cp artifacts/PassKeeper-android/app-release.apk "release/PassKeeper-${{ github.ref_name }}-android.apk"
          cp artifacts/PassKeeper-ios/PassKeeper-unsigned.ipa "release/PassKeeper-${{ github.ref_name }}-ios-unsigned.ipa"

      - uses: softprops/action-gh-release@v2
        with:
          name: PassKeeper ${{ github.ref_name }}
          files: release/*
          generate_release_notes: true